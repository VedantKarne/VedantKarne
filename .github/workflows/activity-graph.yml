name: Update Contribution Graph

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: VedantKarne
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/activity-graph.svg
          options: >-
            bg_color=050816&
            color=7EE787&
            line=39FF88&
            point=ADFFCF&
            area=true&
            area_color=0B5D3B&
            hide_border=true&
            radius=16&
            custom_title=Engineering%20Momentum

      - name: Publish graph
        uses: crazy-max/ghaction-github-pages@v3
        with:
          build_dir: dist
          target_branch: activity-graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
